spring.application.name=billetterie
spring.datasource.url=jdbc:postgresql://localhost:5432/billetterie
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
#springdoc.swagger-ui.path=
logging.level.org.hibernate.boot=DEBUG
logging.level.org.hibernate.mapping=    DEBUG
# Activer l'outil de migration (Flyway)
spring.flyway.enabled=true

# Indiquer l'emplacement des fichiers (optionnel, c'est la valeur par défaut)
spring.flyway.locations=classpath:db/migration

# Crucial si vous avez déjà des tables dans votre base de données avant d'utiliser les migrations
spring.flyway.baseline-on-migrate=true