spring.application.name=billetterie

# 1. Port dynamique attribué par Render (8080 en local)
server.port=${PORT:8080}

# 2. Base de données : Neon en ligne (si variables Render définies), PostgreSQL local sinon
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/billetterie}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. JPA & Logging Hibernate
spring.jpa.hibernate.ddl-auto=update
logging.level.org.hibernate.boot=DEBUG
logging.level.org.hibernate.mapping=DEBUG

# 4. Flyway Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# 5. Documentation API (Swagger UI & Redoc)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.redoc.path=/redoc.html